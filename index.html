<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborative Time Capsule</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>
  <div class="container">
    <h1>⏳ Collaborative Time Capsule</h1>

    <div class="section">
      <h2>Create a Capsule</h2>
      <input id="capsuleName" type="text" placeholder="Capsule name" />
      <input id="openDate" type="date" />
      <button onclick="createCapsule()">Create Capsule</button>
    </div>

    <div class="section">
      <h2>Add Message</h2>
      <select id="capsuleSelect"></select>
      <input id="userName" type="text" placeholder="Your name" />
      <textarea id="message" placeholder="Write your message..."></textarea>
      <button onclick="addMessage()">Add to Capsule</button>
    </div>

    <div class="section">
      <h2>Open Capsule</h2>
      <select id="openSelect"></select>
      <button onclick="openCapsule()">Open Selected Capsule</button>
      <div id="capsuleContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
